name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # gradlew repo mein nahi hai, isliye seedha Gradle 8.7 install karke chalate hain
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GramCall-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Unit tests (fail hone par bhi APK upar ban chuka hota hai)
        run: gradle testDebugUnitTest --stacktrace

      - name: Upload reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports
            app/build/test-results
